name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and run emitted C++ tests
        run: make test-cpp

      - name: Build and run emitted Rust tests
        run: make test-rust
